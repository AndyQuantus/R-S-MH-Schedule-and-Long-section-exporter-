[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhls"
version = "0.1.0"
description = "Manhole Schedule and Long Section Standardiser"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pdfplumber>=0.10",
    "camelot-py[cv]>=0.11",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
    "Pillow>=10.0",
]

[project.scripts]
mhls = "mhls.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
